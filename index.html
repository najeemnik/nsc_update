<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf5ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100d0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NIK SMART COUNT - Database & Accounting</title>
    <meta name="description" content="Building Project Management & Construction Accounting System for high-rise and building owners with Google Drive integration" />
    <meta property="og:title" content="NIK SMART COUNT - Database & Accounting" />
    <meta property="og:description" content="Building Project Management & Construction Accounting System for high-rise and building owners" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Anti-FOUC: apply saved theme + day/night mode before first paint.
      (function () {
        try {
          var raw = localStorage.getItem('nik_smart_count_appSettings');
          var s = raw ? JSON.parse(raw) : {};
          var schedule = s.themeSchedule || 'auto';
          var hour = new Date().getHours();
          var isDark = schedule === 'auto' ? !(hour >= 7 && hour < 19) : schedule === 'dark';
          var themeMap = {
            glassmorphism: 'theme-glassmorphism',
            neumorphism: 'theme-neumorphism',
            skeuomorphism: 'theme-skeuomorphism',
            squirclemorphism: 'theme-squirclemorphism',
            metalmorphism: 'theme-metalmorphism',
            ar_morphism: 'theme-ar-morphism'
          };
          var cls = document.documentElement.classList;
          if (isDark) cls.add('dark');
          cls.add(themeMap[s.theme] || 'theme-glassmorphism');
        } catch (e) { /* first visit or corrupted storage */ }
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
